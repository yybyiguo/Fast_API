exclude: ^(backend/\.idea/|backend/\.venv/|backend/alembic/versions/|backend/logs/|backend/dump\.rdb|backend/celerybeat-schedule|frontend/node_modules/|frontend/dist/|dump\.rdb|\.tmp-redis/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --config, backend/pyproject.toml]
      - id: ruff-format
        args: [--config, backend/pyproject.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # compose 的 !reset / !override 是自定义标签，PyYAML 不认；
        # 这类文件改用 `docker compose config` 校验。
        exclude: ^docker-compose\.prod\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
