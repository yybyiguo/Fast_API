# 生产环境覆盖文件：只让 web 对外暴露 80，其它服务只在 Docker 网络内互通。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 为什么要单独一个文件：基础文件把 mysql/redis/api/rsshub 的端口都映射到了宿主机，
# 方便本地调试；但生产上 API 一旦能被直连，就可以绕过 Nginx 伪造 X-Forwarded-For，
# 限流和访问日志都会失真。Docker 发布端口还会绕过主机防火墙，所以必须靠配置保证。
#
# !reset []   清空基础文件里的 ports（Compose 2.24+ 的合并语法）
# !override   整段替换，而不是追加

services:
  mysql:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    ports: !reset []

  rsshub:
    ports: !reset []

  prometheus:
    ports: !reset []

  celery-exporter:
    ports: !reset []

  web:
    ports: !override
      - "80:80"
