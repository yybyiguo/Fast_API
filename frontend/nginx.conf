# 按来源 IP 限速：每个 IP 每秒最多 10 个请求。
# 10m 是共享内存大小，大约能记住 16 万个 IP 的计数。
# 这条指令必须放在 http 上下文；conf.d 下的文件整体会被 include 进 http{}，
# 所以写在 server 外面就对了，写进 server 里会报错。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 超限返回 429；默认是 503，前端会误以为“服务挂了”
    limit_req_status 429;
    # 被限流的请求记 warn，避免默认的 error 级别把日志刷爆
    limit_req_log_level warn;

    # 让 429 也返回 JSON，前端 http.js 能直接拿到 message 显示
    error_page 429 /429.json;

    # 前后端同源：浏览器只访问 8080，/api 由 Nginx 转发给容器里的 api
    location /api/ {
        # burst=20：允许瞬间多来 20 个（页面打开时本来就会并发几个请求）
        # nodelay：这 20 个立即放行、不排队；超过之后按每秒 10 个的速度漏
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加：$proxy_add_x_forwarded_for 会保留客户端自带的头，
        # 后端取第一个值时就可能拿到伪造 IP，绕过限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # vue-router 是 history 模式，刷新子路由要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
