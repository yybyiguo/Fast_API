[project]
name = "fast-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.1",
    "bcrypt<4.1",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
