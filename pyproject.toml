[project]
name = "fast-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.1",
    "bcrypt<4.1",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff~=0.17.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio 1.x 要求显式声明 fixture 的事件循环作用域
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
# 单个测试超过 60 秒直接失败，避免 CI 被锁/死循环拖住
timeout = 60


[tool.coverage.run]
source = ["."]
# 只统计业务代码：测试、迁移、CLI 脚本不参与覆盖率
omit = [
  "tests/*",
  "alembic/*",
  "scripts/*",
  "conftest.py",
  ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75


[tool.ruff]
target-version = "py313"
line-length = 100
# 笔记里的代码块不参与格式化，避免每次提交都改 Markdown
extend-exclude = ["*.md"]

[tool.ruff.lint]
# 先从 flake8 等价的最安全集合开始
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]


[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"alembic/versions/*" = ["UP007", "UP035", "UP006"]

[tool.ruff.lint.isort]
known-first-party = [
  "cache", "config", "curd", "models", "routers",
  "schemas", "scripts", "services", "tasks", "utils",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
  "fastapi.Header", "fastapi.Form", "fastapi.File", "fastapi.Security",
]
